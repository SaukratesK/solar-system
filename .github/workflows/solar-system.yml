name: Solar System WF

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
jobs:
  unit-testing:
    name: Unit testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: actions/checkout@v4

      - name: Setup Node Version - 18
        run: actions/setup-node@v3
        with: 
          node-version: 18

      - name: Install Dependencies
        run: npm install 

      - name: Unit Testing 
        run: npm test
